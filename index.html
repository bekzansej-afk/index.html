<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информатика 6-сынып | Интерактивті Тест</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --correct: #10B981;
            --wrong: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6B7280;
            font-size: 15px;
        }

        /* Нұсқа таңдау терезесі */
        .variant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .btn-variant {
            background: #EEF2FF;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-variant:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* Тест терезесі */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #E5E7EB;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #F9FAFB;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--primary);
            background-color: #EEF2FF;
        }

        .option-btn.correct {
            background-color: #D1FAE5 !important;
            border-color: var(--correct) !important;
            color: #065F46;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: #FEE2E2 !important;
            border-color: var(--wrong) !important;
            color: #991B1B;
        }

        /* Эмоция фидбегі */
        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .feedback-emoji {
            font-size: 40px;
        }

        .next-btn {
            margin-top: 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Соңғы нәтиже терезесі */
        .result-screen {
            text-align: center;
            display: none;
        }

        .result-emoji {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .score-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .grade-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .action-btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
        }

        .btn-home {
            background-color: #6B7280;
            color: white;
        }

        .hide { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💻 Информатика 6-сынып</h1>
        <p class="subtitle">Интерактивті білім тексеру сайты</p>
    </header>

    <!-- 1. НҰСҚА ТАҢДАУ ТЕРЕЗЕСІ -->
    <div id="variant-screen">
        <h2 style="text-align: center; font-size: 20px; margin-bottom: 15px;">Тест нұсқасын таңдаңыз:</h2>
        <div class="variant-grid">
            <button class="btn-variant" onclick="startQuiz(1)">1-нұсқа</button>
            <button class="btn-variant" onclick="startQuiz(2)">2-нұсқа</button>
            <button class="btn-variant" onclick="startQuiz(3)">3-нұсқа</button>
            <button class="btn-variant" onclick="startQuiz(4)">4-нұсқа</button>
            <button class="btn-variant" onclick="startQuiz(5)">5-нұсқа</button>
        </div>
    </div>

    <!-- 2. ТЕСТ СҰРАҚТАРЫ ТЕРЕЗЕСІ -->
    <div id="quiz-screen" class="hide">
        <div class="quiz-header">
            <span id="variant-title">1-нұсқа</span>
            <span id="question-count">Сұрақ: 1/10</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="question-text" id="question-text">Сұрақ мәтіні...</div>
        <div class="options-list" id="options-container"></div>

        <div class="feedback-box" id="feedback-box">
            <div class="feedback-emoji" id="feedback-emoji">🥳</div>
            <div>
                <strong id="feedback-title">Өте тамаша!</strong>
                <p id="feedback-desc" style="font-size: 14px; margin-top: 3px;"></p>
            </div>
        </div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Келесі сұрақ ➔</button>
    </div>

    <!-- 3. НӘТИЖЕ ТЕРЕЗЕСІ -->
    <div id="result-screen" class="result-screen">
        <div class="result-emoji" id="result-emoji">🏆</div>
        <h2>Тест аяқталды!</h2>
        <p class="score-text" id="score-text">Сіз 10-нан 8 ұпай жинадыңыз (80%)</p>
        <div class="grade-badge" id="grade-badge">Өте жақсы!</div>

        <div class="btn-group">
            <button class="action-btn btn-restart" onclick="restartCurrentVariant()">Осы нұсқаны қайта өту</button>
            <button class="action-btn btn-home" onclick="showVariantScreen()">Басқа нұсқаны таңдау</button>
        </div>
    </div>
</div>

            { q: "Файлдық жүйе дегеніміз не?", options: ["Дискіде файлдарды сақтау мен ұйымдастыру тәртібі", "Сурет салатын бағдарлама", "Компьютердің вирусы", "Интернет провайдері"], correct: 0, exp: "Файлдық жүйе файлдардың құрылымы мен орналасуын басқарады." },
            { q: "Интернетте құпия сөзді (пароль) қалай ойлап тапқан дұрыс?", options: ["Әріптер, сандар және арнайы таңбалардан тұратын күрделі пароль", "Тек '123456'", "Өз атыңды қою", "Туған жылыңды қою"], correct: 0, exp: "Күрделі пароль аккаунтты бұзылудан қорғайды." },

        ],
        5: [
            { q: "Желілік алаяқтардан (фишингтен) сақтанудың алтын ережесі:", options: ["Жеке деректерді бейтаныс сайттарға енгізбеу", "Барлық сілтемені баса беру", "Банк картасын суретке түсіріп жіберу", "Парольді бәріне айту"], correct: 0, exp: "Жеке мәліметтерді ешқашан бөгде сайттарға енгізбеңіз!" },
            { q: "Презентация файлының кеңейтілімін тап:", options: [".pptx", ".mp3", ".png", ".exe"], correct: 0, exp: ".pptx — MS PowerPoint презентация файлы." },
            { q: "Компьютердің негізгі жады түрлерін ата:", options: ["Ішкі (RAM, ROM) және сыртқы (HDD, SSD, Flash)", "Тек монитор", "Тек процессор", "Кабельдер мен сымдар"], correct: 0, exp: "Компьютер жадысы ішкі және сыртқы болып екіге бөлінеді." },

            { q: "Білім (Knowledge) дегеніміз не?", options: ["Ақпаратты түсіну, тәжірибеде қолдану және қорытынды жасау", "Кез келген сан", "Таңбалар жиыны", "Сканерленген сурет"], correct: 0, exp: "Білім — бұл ақпаратты сараптап, іс-жүзінде қолдану қабілеті." },
            { q: "Операциялық жүйе жүктелмей тұрып, сақталған бағдарлама қайда орналасады?", options: ["ROM (BIOS)", "Жедел жады (RAM)", "Флешкада", "Интернетте"], correct: 0, exp: "BIOS микробағдарламасы ROM чипінде сақталады." }

    };

    // ЭМОЦИЯЛАР ТІЗІМІ
    const happyEmojis = ["🥳", "🎉", "😍", "👏", "⭐", "👍", "🔥"];
    const sadEmojis = ["😢", "🤔", "❌", "😅", "💔", "🧐"];

    let currentVariant = 1;
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOptionIndex = null;

    function startQuiz(variant) {
        currentVariant = variant;
        currentQuestionIndex = 0;
        score = 0;

        document.getElementById("variant-screen").classList.add("hide");
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("quiz-screen").classList.remove("hide");
        document.getElementById("variant-title").innerText = `${variant}-нұсқа`;

        loadQuestion();
    }

    function loadQuestion() {
        const questions = quizData[currentVariant];
        const q = questions[currentQuestionIndex];

        document.getElementById("question-count").innerText = `Сұрақ: ${currentQuestionIndex + 1}/${questions.length}`;
        document.getElementById("progress-fill").style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
        document.getElementById("question-text").innerText = `${currentQuestionIndex + 1}. ${q.q}`;

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        // Жасыру
        document.getElementById("feedback-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        q.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
            btn.onclick = () => selectOption(idx);
            container.appendChild(btn);
        });
    }

    function selectOption(index) {
        const questions = quizData[currentVariant];
        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll(".option-btn");

        buttons.forEach(btn => btn.disabled = true);

        const feedbackBox = document.getElementById("feedback-box");
        const feedbackEmoji = document.getElementById("feedback-emoji");
        const feedbackTitle = document.getElementById("feedback-title");
        const feedbackDesc = document.getElementById("feedback-desc");

        if (index === q.correct) {
            score++;
            buttons[index].classList.add("correct");
            
            const randomEmoji = happyEmojis[Math.floor(Math.random() * happyEmojis.length)];
            feedbackEmoji.innerText = randomEmoji;
            feedbackTitle.innerText = "Бәрекелді! Өте дұрыс!";
            feedbackTitle.style.color = "#065F46";
            feedbackBox.style.backgroundColor = "#D1FAE5";
            feedbackDesc.innerText = q.exp;
        } else {
            buttons[index].classList.add("wrong");
            buttons[q.correct].classList.add("correct");

            const randomEmoji = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
            feedbackEmoji.innerText = randomEmoji;
            feedbackTitle.innerText = "Қателестіңіз! Дұрыс жауап белгіленді.";
            feedbackTitle.style.color = "#991B1B";
            feedbackBox.style.backgroundColor = "#FEE2E2";
            feedbackDesc.innerText = q.exp;
        }

        feedbackBox.style.display = "flex";
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        const questions = quizData[currentVariant];
        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-screen").classList.add("hide");
        const resultScreen = document.getElementById("result-screen");
        resultScreen.style.display = "block";

        const questions = quizData[currentVariant];
        const percent = Math.round((score / questions.length) * 100);

        document.getElementById("score-text").innerText = `Сіз ${questions.length}-нан ${score} ұпай жинадыңыз (${percent}%)`;

        const emojiEl = document.getElementById("result-emoji");
        const badgeEl = document.getElementById("grade-badge");

        if (percent >= 90) {
            emojiEl.innerText = "🏆";
            badgeEl.innerText = "Үздік нәтиже! 🌟 5-тік баға";
            badgeEl.style.backgroundColor = "#D1FAE5";
            badgeEl.style.color = "#065F46";
        } else if (percent >= 70) {
            emojiEl.innerText = "👍";
            badgeEl.innerText = "Жақсы нәтиже! 👏 4-тік баға";
            badgeEl.style.backgroundColor = "#DBEAFE";
            badgeEl.style.color = "#1E40AF";
        } else if (percent >= 50) {
            emojiEl.innerText = "🙂";
            badgeEl.innerText = "Қанағаттанарлық! 💪 3-тік баға";
            badgeEl.style.backgroundColor = "#FEF3C7";
            badgeEl.style.color = "#92400E";
        } else {
            emojiEl.innerText = "📚";
            badgeEl.innerText = "Тағы да қайталап көр! 🔄";
            badgeEl.style.backgroundColor = "#FEE2E2";
            badgeEl.style.color = "#991B1B";
        }
    }

    function restartCurrentVariant() {
        startQuiz(currentVariant);
    }

    function showVariantScreen() {
        document.getElementById("quiz-screen").classList.add("hide");
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("variant-screen").classList.remove("hide");
    }
</script>
